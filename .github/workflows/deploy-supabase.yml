# Deploys the server (the "sponsors" Supabase Edge Function). Run it by hand: Actions > Deploy server (Supabase) > Run workflow.
# Needs repository > Settings > Secrets and variables > Actions > Secrets:
#   SUPABASE_ACCESS_TOKEN = a token from supabase.com/dashboard/account/tokens with Edge Functions write permission
#   (or a legacy token). Without it, deploy from a computer:
#   npx supabase login, then npx supabase functions deploy sponsors --project-ref <ref> --no-verify-jwt --use-api --yes
# To deploy on every push again, add under "on:":  push: { branches: [main], paths: ['supabase/**'] }
name: Deploy server (Supabase)
on:
  workflow_dispatch:
concurrency:
  group: supabase
  cancel-in-progress: false
env:
  PROJECT_REF: lojfwwmddjarzgnxzyzi
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the acceptance tests first
        run: npm test
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy the function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Problems are reported as a short error on the run's summary page
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::The SUPABASE_ACCESS_TOKEN secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if ! out=$(supabase functions deploy sponsors --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes 2>&1); then
            echo "$out"
            echo "::error::$(echo "$out" | grep -v '^\s*$' | tail -3 | tr '\n' ' ')"
            exit 1
          fi
          echo "$out"
