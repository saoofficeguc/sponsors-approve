# Every hour: ends reservations that passed 14 days without a contact, sends reminders,
# and keeps the free Supabase project from pausing. (The server also does this on every visit.)
name: Hourly reservation check
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call the server
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 60 -X POST "https://lojfwwmddjarzgnxzyzi.supabase.co/functions/v1/sponsors/api/tick" && echo
